name: Publier le guide

on:
  workflow_dispatch:          # bouton « Run workflow » dans GitHub
  schedule:
    - cron: "17 2 * * *"      # chaque nuit vers 3h-4h (heure suisse)
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lire Notion, traduire, construire le site
        run: node scripts/build.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
