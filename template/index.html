<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Moulin 1771 · Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: single reading column, sticky language + section bar, essentials first, then house, then village */
  --paper:#f3f2ee;      /* lime-washed stone */
  --ink:#1d2430;        /* night over Anniviers */
  --muted:#5d6572;
  --line:#d9d7d0;
  --larch:#6b4a2f;      /* sunburnt larch of the mayens */
  --geranium:#c2362f;   /* window boxes of the Rue du Village */
  --card:#ffffff;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15191f; --ink:#ecebe6; --muted:#a3a9b3; --line:#2c323c;
    --larch:#c99a6e; --geranium:#ef6b5f; --card:#1c2128; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15191f; --ink:#ecebe6; --muted:#a3a9b3; --line:#2c323c;
  --larch:#c99a6e; --geranium:#ef6b5f; --card:#1c2128; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16.5px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration-color:var(--geranium);text-underline-offset:3px;text-decoration-thickness:1.5px}
a:focus-visible,button:focus-visible{outline:2px solid var(--geranium);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

.proto{background:var(--ink);color:var(--paper);font-size:13px;text-align:center;padding:6px 16px}

header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.mark{font-family:var(--display);font-size:19px;letter-spacing:.01em;text-decoration:none}
.mark span{color:var(--geranium)}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{font:600 13px var(--body);letter-spacing:.04em;border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:14px;min-height:108px;padding:14px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ink)}
@media (prefers-reduced-motion: no-preference){.tile:active{transform:scale(.98)}}
.tile svg{width:26px;height:26px;stroke:var(--larch);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile span{font:600 14px/1.25 var(--body);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.tile.new{border-color:var(--geranium)}
.tile.new svg{stroke:var(--geranium)}
.back{display:inline-flex;align-items:center;gap:6px;margin:22px 0 4px;font:600 14px var(--body);color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.detail-head{display:flex;align-items:center;gap:14px;margin:10px 0 18px}
.detail-head .ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.detail-head svg{width:28px;height:28px;stroke:var(--larch);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.detail-head h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.1;margin:0;text-wrap:balance}
.detail section.item{border-top:0;padding-top:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.pager a{font:600 14.5px var(--body);text-decoration:none;color:var(--ink);max-width:48%}
.pager a small{display:block;font:500 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager .nx{text-align:right;margin-left:auto}

.hero{padding:40px 0 28px}
.hero .year{font:600 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--larch)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1.05;margin:8px 0 18px;text-wrap:balance}
.hero p{margin:0 0 12px;max-width:62ch}
.hero p.note{font-family:var(--display);color:var(--larch);font-size:17px}
.hero-img{margin:16px 0 0;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--line)}
@media (min-width:560px){.hero-img{aspect-ratio:16/9}}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.gallery.one{grid-template-columns:1fr}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.ess p{margin:0}
.ess strong{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.part-intro p{margin:0 0 8px}
.sign{font-family:var(--display);color:var(--larch)}

.essentials{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0 8px}
.ess{background:var(--card);padding:14px 16px}
.ess .k{font:600 11.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ess .v{font-size:15.5px;line-height:1.45}
.ess .big{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.ess.wide{grid-column:1/-1}
.ess.secret{background:color-mix(in srgb,var(--geranium) 7%,var(--card))}
@media (max-width:330px){.essentials{grid-template-columns:1fr}}

.part-title{display:flex;align-items:baseline;gap:14px;margin:44px 0 4px}
.part-title .n{font:600 12px var(--body);letter-spacing:.16em;color:var(--geranium)}
.part-title h2{font-family:var(--display);font-weight:400;font-size:34px;margin:0}
.part-intro{color:var(--muted);margin:0 0 8px;max-width:62ch}

section.item{border-top:1px solid var(--line);padding:22px 0 18px;scroll-margin-top:110px}
section.item h3{font:600 18px var(--body);margin:0 0 8px;letter-spacing:-.005em}
section.item p{margin:0 0 10px;max-width:65ch}
section.item ul{margin:0 0 10px;padding-left:18px}
section.item li{margin:2px 0}
.note{font-size:14.5px;color:var(--muted)}
.tag{display:inline-block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--larch);border:1px solid currentColor;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.places{list-style:none;padding:0!important;display:grid;gap:8px}
.places a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none}
.places a:hover{border-color:var(--ink)}
.places b{display:block;font-weight:600}
.places i{display:block;font-style:normal;color:var(--muted);font-size:14px;margin-top:1px}
.places a::after{content:"›";margin-left:auto;font-size:22px;color:var(--muted);line-height:1}
table.sos{border-collapse:collapse;width:100%;max-width:420px;margin-top:6px}
table.sos td{padding:7px 0;border-bottom:1px solid var(--line)}
table.sos td:last-child{text-align:right;font:600 17px var(--body);font-variant-numeric:tabular-nums}

footer{margin:56px 0 0;padding:24px 0 48px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="proto" id="proto" hidden></div>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="mark" href="#top">Le Moulin <span>·</span> 1771</a>
      <div class="langs" role="group" aria-label="Langue">
        <button type="button" id="lang-fr" data-l="fr">FR</button>
        <button type="button" id="lang-de" data-l="de">DE</button>
        <button type="button" id="lang-en" data-l="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="top">
  <div id="home">
  <figure class="hero-img" id="hero-img" hidden></figure>
  <div class="hero">
    <div class="year" id="h-eyebrow"></div>
    <h1 id="h-title"></h1>
    <div id="h-intro"></div>
    
  </div>
  <div class="essentials" id="ess"></div>
  <div id="parts"></div>
  </div>
  <div id="detail" class="detail" hidden></div>
  <footer>
    <span id="f-upd"></span>
    <span>Rue du Village 74 · 3961 Grimentz</span>
  </footer>
</main>

<script>
/* Filled in at build time from the Notion database "Guide Le Moulin" */
const DATA = /*__DATA__*/null;

const UI = {
  proto:{fr:"",de:"",en:""},
  eyebrow:{fr:"Grimentz · Val d'Anniviers · 1564 m",de:"Grimentz · Val d'Anniviers · 1564 m",en:"Grimentz · Val d'Anniviers · 1,564 m"},
  parts:{house:{fr:"La maison",de:"Die Wohnung",en:"The apartment"},village:{fr:"Grimentz",de:"Grimentz",en:"Grimentz"}},
  updated:{fr:"Mis à jour le",de:"Aktualisiert am",en:"Updated"},
  newTag:{fr:"Nouveau",de:"Neu",en:"New"},
  back:{fr:"Retour au guide",de:"Zurück zum Guide",en:"Back to the guide"},
  prev:{fr:"Précédent",de:"Zurück",en:"Previous"},
  next:{fr:"Suivant",de:"Weiter",en:"Next"},
  doc:{fr:"Guide",de:"Gästeinfo",en:"Guest guide"}
};
const IC = {
 acces:'<path d="M5 17h14M6 17v2M18 17v2M4 13l2-5h12l2 5v4H4z"/><circle cx="8" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/>',
 parking:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/>',
 bus:'<rect x="5" y="3" width="14" height="15" rx="2"/><path d="M5 11h14M8 21v-3M16 21v-3"/><circle cx="8.5" cy="14.5" r=".8"/><circle cx="15.5" cy="14.5" r=".8"/>',
 cle:'<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/>',
 cuisine:'<path d="M4 11h16v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM2 11h2M20 11h2M9 7c0-1 1-1 1-2s-1-1-1-2M14 7c0-1 1-1 1-2s-1-1-1-2"/>',
 poele:'<path d="M12 21c-4 0-6-2.5-6-6 0-3 2-5 3-7 0 2 1 3 2 3 0-3 1-6 4-8 0 3 3 5 3 9 0 5-2.5 9-6 9z"/><path d="M12 21c-1.5 0-2.5-1-2.5-2.5S11 16 12 14c1 2 2.5 3 2.5 4.5S13.5 21 12 21z"/>',
 chauffage:'<path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/><path d="M12 10v6"/>',
 tv:'<rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/>',
 skis:'<path d="M5 3l11 18M10 3l11 18M3 17l4 1M8 17l4 1"/>',
 dechets:'<path d="M4 7h16M10 3h4M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
 securite:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 9v6M9 12h6"/>',
 liens:'<path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/>',
 restaurants:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 21V3c-2 1-3 4-3 8h3"/>',
 courses:'<path d="M3 9h18l-2 11H5zM8 9l3-6M16 9l-3-6M9 13v3M15 13v3"/>',
 bars:'<path d="M7 3h10l-1 7a4 4 0 0 1-8 0zM12 14v7M8 21h8"/>',
 sport:'<path d="M3 20l6-10 4 6 3-4 5 8z"/><path d="M9 10l2-3 2 3"/>',
 pluie:'<path d="M7 15a4 4 0 1 1 1-7.9A5 5 0 0 1 17.5 9 3.5 3.5 0 0 1 17 15z"/><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2"/>',
 patinoire:'<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 6l2.5-1.5M9.5 19.5L12 18l2.5 1.5"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
 photo:'<rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/>',
 carte:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/>',
 velo:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l2 7M14 6h2"/>',
 soleil:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 enfants:'<circle cx="9" cy="6" r="2.5"/><circle cx="16.5" cy="9" r="2"/><path d="M5 21v-6a4 4 0 0 1 8 0v6M13.5 21v-4a3 3 0 0 1 6 0v4"/>',
 patrimoine:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M12 4v6M12 14v6M4 12h6M14 12h6M6.3 6.3l4.3 4.3M13.4 13.4l4.3 4.3M17.7 6.3l-4.3 4.3M10.6 13.4l-4.3 4.3"/>'
};
const svg = id => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[id]||""}</svg>`;


function pickLang(){
  try{const s=localStorage.getItem("moulin-lang"); if(["fr","de","en"].includes(s)) return s;}catch(e){}
  const n=(navigator.language||"fr").slice(0,2);
  return ["fr","de","en"].includes(n)?n:"en";
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gallery = (ph,alt) => ph&&ph.length?`<div class="gallery${ph.length===1?" one":""}">${ph.map(src=>`<img src="${src}" alt="${esc(alt)}" loading="lazy">`).join("")}</div>`:"";

function render(l){
  document.documentElement.lang=l;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  const proto=document.getElementById("proto"); proto.hidden=true;
  const H=DATA.home;
  document.getElementById("h-eyebrow").textContent=UI.eyebrow[l];
  document.getElementById("h-title").textContent=H?H.title[l]:"Le Moulin 1771";
  document.getElementById("h-intro").innerHTML=H?H.html[l]:"";
  const hero=document.getElementById("hero-img");
  if(H&&H.photos.length){hero.innerHTML=`<img src="${H.photos[0]}" alt="Le Moulin 1771, Grimentz">`;hero.hidden=false;}else hero.hidden=true;
  document.getElementById("ess").innerHTML=DATA.ess.map(e=>`<div class="ess${e.wide?" secret wide":""}"><div class="k">${esc(e.title[l])}</div><div class="v">${e.html[l]}</div></div>`).join("");
  let html="", n=0;
  for(const part of ["house","village"]){
    const secs=DATA.sections.filter(x=>x.part===part); if(!secs.length) continue;
    n++;
    const intro=DATA.intro[part];
    html+=`<div class="part-title"><span class="n">0${n}</span><h2>${esc(intro?intro.title[l]:UI.parts[part][l])}</h2></div>${intro?`<div class="part-intro">${intro.html[l]}</div>`:""}<div class="tiles">`;
    for(const s of secs) html+=`<a class="tile${s.isNew?" new":""}" href="#${s.id}">${svg(s.icon)}<span>${esc(s.title[l])}</span></a>`;
    html+=`</div>`;
  }
  document.getElementById("parts").innerHTML=html;
  document.getElementById("f-upd").textContent=`${UI.updated[l]} ${DATA.updated}`;
  document.title="Le Moulin 1771 · "+UI.doc[l];
  route(l);
}
function route(l){
  const id=decodeURIComponent(location.hash.slice(1));
  const i=DATA.sections.findIndex(x=>x.id===id);
  const home=document.getElementById("home"), det=document.getElementById("detail");
  if(i<0){home.hidden=false;det.hidden=true;return;}
  const s=DATA.sections[i], pv=DATA.sections[i-1], nx=DATA.sections[i+1];
  det.innerHTML=`<a class="back" href="#top">← ${UI.back[l]}</a>
    <div class="detail-head"><div class="ic">${svg(s.icon)}</div><h2>${esc(s.title[l])}${s.isNew?`<span class="tag">${UI.newTag[l]}</span>`:""}</h2></div>
    <section class="item">${s.html[l]}${gallery(s.photos,s.title[l])}</section>
    <div class="pager">${pv?`<a href="#${pv.id}"><small>${UI.prev[l]}</small>${esc(pv.title[l])}</a>`:""}${nx?`<a class="nx" href="#${nx.id}"><small>${UI.next[l]}</small>${esc(nx.title[l])}</a>`:""}</div>`;
  home.hidden=true; det.hidden=false; window.scrollTo(0,0);
}
let lang=pickLang();
window.addEventListener("hashchange",()=>{route(lang); if(!DATA.sections.some(x=>x.id===location.hash.slice(1))) window.scrollTo(0,0);});
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.l; try{localStorage.setItem("moulin-lang",lang);}catch(e){} render(lang);
}));
render(lang);
</script>
</body>
</html>
